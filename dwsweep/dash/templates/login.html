<!doctype html><html><head><meta charset="utf-8"><title>DW//ACCESS</title>
<style>
*{box-sizing:border-box}body{margin:0;height:100vh;display:grid;place-items:center;background:#04070a;color:#39ff14;font:14px/1.5 "SF Mono",Menlo,monospace}
body:before{content:"";position:fixed;inset:0;background:repeating-linear-gradient(0deg,#39ff1405 0 1px,transparent 1px 3px);pointer-events:none}
.box{border:1px solid #39ff1455;padding:34px 30px;background:#06100bcc;box-shadow:0 0 40px #39ff1422;min-width:320px}
h1{margin:0 0 4px;font-size:18px;letter-spacing:3px}.sub{color:#39ff1488;font-size:11px;margin-bottom:22px}
input{width:100%;padding:11px;background:#020604;border:1px solid #39ff1444;color:#c9ffb8;font:inherit;outline:none}
input:focus{border-color:#39ff14;box-shadow:0 0 12px #39ff1433}
button{margin-top:14px;width:100%;padding:11px;background:#39ff14;color:#03170a;border:0;font:700 13px inherit;letter-spacing:2px;cursor:pointer}
button:hover{background:#7dff5e}.err{color:#ff4b4b;font-size:11px;margin-top:10px;letter-spacing:1px}
.foot{margin-top:18px;color:#39ff1455;font-size:10px;letter-spacing:1px}
</style></head><body>
<form class="box" method="post">
<h1>&gt;_ DARKWAVE</h1><div class="sub">// restricted console</div>
<input name="pw" type="password" placeholder="passphrase" autofocus autocomplete="off">
<button>&#9654; AUTH</button>
{% if err %}<div class="err">{{ err }}</div>{% endif %}
<div class="foot">node: /opt/dwsweep &middot; masscan pipeline</div>
</form></body></html>
